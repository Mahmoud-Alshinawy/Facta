<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facta notes widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.wg,.wg[data-theme="bg"]{--surface:#0C0D0C;--raised:#121412;--raised-2:#191C18;--border-strong:#262A25;--control-border:#5F685E;--text:#F1F4F1;--text-2:#A6AEA6;--muted:#868F86;--accent:#22C55E;--accent-text:#03210F;--accent-soft:rgba(34,197,94,.12);--note-a:#E8C547;--note-b:#5B8DEF;--note-c:#EC6FB0;--note-d:#4CC38A;--surface-rgb:12,13,12;--text-rgb:241,244,241;--t-alpha:.46;--t-shadow:0 1px 2px rgba(0,0,0,.55)}
.wg[data-theme="mid"]{--surface:#090E1A;--raised:#0E1524;--raised-2:#141C30;--border-strong:#212C45;--control-border:#55668F;--text:#EEF2FA;--text-2:#A3AECB;--muted:#7D89A8;--accent:#4C8DF6;--accent-text:#04122B;--accent-soft:rgba(76,141,246,.14);--note-a:#E8B04B;--note-b:#67C1F5;--note-c:#EE7DB8;--note-d:#52C98F;--surface-rgb:9,14,26;--text-rgb:238,242,250;--t-alpha:.48;--t-shadow:0 1px 2px rgba(0,0,0,.55)}
.wg[data-theme="ember"]{--surface:#0C0A08;--raised:#120F0D;--raised-2:#191512;--border-strong:#27201C;--control-border:#6E6053;--text:#F6F1EC;--text-2:#B8ADA3;--muted:#938778;--accent:#FF8000;--accent-text:#1F0E00;--accent-soft:rgba(255,128,0,.14);--note-a:#E8C547;--note-b:#6E9CF0;--note-c:#EE78B4;--note-d:#55C08A;--surface-rgb:12,10,8;--text-rgb:246,241,236;--t-alpha:.48;--t-shadow:0 1px 2px rgba(0,0,0,.55)}
.wg[data-theme="light"]{--surface:#FFFFFF;--raised:#F0F1EC;--raised-2:#E7E9E3;--border-strong:#CDD1C8;--control-border:#7E857B;--text:#141713;--text-2:#4E554D;--muted:#626A60;--accent:#15803D;--accent-text:#FFFFFF;--accent-soft:rgba(21,128,61,.10);--note-a:#B45309;--note-b:#2563EB;--note-c:#DB2777;--note-d:#059669;--surface-rgb:255,255,255;--text-rgb:20,23,19;--t-alpha:.74;--t-shadow:none}
.wg{--slant:-10deg;width:300px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border-strong);color:var(--text);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.wg *{box-sizing:border-box}
.wg button{font-family:inherit;color:inherit;cursor:pointer}
.wg button:focus-visible,.wg textarea:focus-visible,.wg input:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wg.is-trans{background:rgba(var(--surface-rgb),var(--t-alpha));border-color:rgba(var(--text-rgb),.14);box-shadow:none;text-shadow:var(--t-shadow)}
.wg.is-trans .tint{background:rgba(var(--text-rgb),.07)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-feature-settings:"tnum"}
.whead{display:flex;align-items:center;gap:8px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.tint{background:var(--raised)}
.nav{width:26px;height:26px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.nav:hover{background:rgba(var(--text-rgb),.08);color:var(--text)}
.field{width:100%;border:0;background:transparent;color:var(--text);font:inherit;resize:none;outline:none;padding:0}
.field::placeholder{color:var(--muted)}
.quick{width:100%;height:38px;padding:0 64px 0 12px;border-radius:10px;border:1px solid var(--control-border);background:transparent;color:var(--text);font:inherit;font-size:13px}
.quick::placeholder{color:var(--muted)}
.quick:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nrow{transition:background .15s ease}
.nrow:hover{background:rgba(var(--text-rgb),.05)}
.sb{height:26px;padding:0;border:0;border-radius:6px;transform:skewX(var(--slant));background:transparent;box-shadow:inset 0 0 0 1px var(--control-border);color:var(--text-2);font-size:11px;font-weight:600}
.sb > span{display:inline-flex;align-items:center;gap:5px;padding:0 9px;transform:skewX(calc(var(--slant) * -1))}
.sb:hover{box-shadow:inset 0 0 0 1px var(--accent);color:var(--text)}
.sb.done{background:var(--accent);color:var(--accent-text);box-shadow:none}
.fold{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 20px 20px 0;border-color:transparent var(--surface) transparent transparent}
.wg.is-trans .fold{display:none}
.dotbtn{width:14px;height:14px;padding:0;border:0;border-radius:7px}
.dotbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
</style>
</helmet>

<div class="{{ rootCls }}" data-theme="{{ themeKey }}">

  <!-- A · STICKY: one pinned note at a time, edit in place -->
  <sc-if value="{{ isSticky }}" hint-placeholder-val="{{ true }}">
    <div class="whead">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"></path><path d="M15 3v6h6"></path></svg>
      <span style="flex: 1">PINNED</span>
      <button type="button" class="nav" aria-label="Previous note" onClick="{{ prevNote }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <span style="color: var(--text)">{{ pos }}</span>
      <button type="button" class="nav" aria-label="Next note" onClick="{{ nextNote }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>
    <div class="tint" style="position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 196px; padding: 14px 16px 12px; border-radius: 12px; border-top: 4px solid {{ cur.color }}">
      <span class="fold" aria-hidden="true"></span>
      <label for="nw-title" class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0)">Note title</label>
      <input id="nw-title" class="field" type="text" value="{{ cur.title }}" onChange="{{ onTitle }}" placeholder="Title" style="font-size: 17px; font-weight: 600; letter-spacing: -0.02em">
      <label for="nw-body" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0)">Note</label>
      <textarea id="nw-body" class="field" rows="6" value="{{ cur.body }}" onChange="{{ onBody }}" placeholder="Write anything…" style="flex: 1; font-size: 14px; line-height: 1.55; color: var(--text-2)"></textarea>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div role="group" aria-label="Note colour" style="display: flex; gap: 6px">
        <sc-for list="{{ colors }}" as="c" hint-placeholder-count="4">
          <button type="button" class="dotbtn" aria-label="{{ c.name }}" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="background: {{ c.v }}"></button>
        </sc-for>
      </div>
      <span style="flex: 1"></span>
      <span class="mono" style="font-size: 11px; color: var(--muted)">{{ cur.words }} words</span>
    </div>
  </sc-if>

  <!-- B · STACK: quick capture on top, recent notes below -->
  <sc-if value="{{ isStack }}" hint-placeholder-val="{{ false }}">
    <div class="whead">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="flex: 1">NOTES</span>
      <span style="color: var(--text)">{{ noteCount }}</span>
    </div>
    <form onSubmit="{{ addNote }}" style="position: relative">
      <label for="nw-quick" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0)">Quick note</label>
      <input id="nw-quick" class="quick" type="text" autocomplete="off" placeholder="Jot something…" value="{{ draft }}" onChange="{{ onDraft }}">
      <span class="mono" aria-hidden="true" style="position: absolute; right: 8px; top: 10px; font-size: 10px; color: var(--muted); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 4px">Enter</span>
    </form>
    <ul style="list-style: none; margin: 0 -6px; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{ stack }}" as="n" hint-placeholder-count="4">
        <li class="nrow" style="display: flex; gap: 10px; padding: 9px 6px; border-radius: 9px">
          <span aria-hidden="true" style="width: 3px; flex: 0 0 auto; border-radius: 2px; transform: skewX(-10deg); background: {{ n.color }}"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ n.title }}</span>
            <span style="font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ n.preview }}</span>
          </span>
          <span class="mono" style="font-size: 10px; color: var(--muted); padding-top: 2px">{{ n.when }}</span>
        </li>
      </sc-for>
    </ul>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["sticky","stack"],"default":"sticky"},"theme":{"editor":"enum","options":["bg","mid","ember","light"],"default":"bg"},"transparent":{"editor":"boolean","default":false},"$preview":{"width":300,"height":340}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      idx: 0, draft: '', lineDraft: '', toast: '', nextId: 10,
      notes: [
        { id: 1, title: 'Lab report outline', body: 'Intro → method → results → discussion.\nAsk the TA about error bars before Thursday.', color: 'a', when: '13:05' },
        { id: 2, title: 'Things for grandma', body: 'Call after Maghrib.\nAsk about her knee, send the photos from Friday.', color: 'c', when: 'Yesterday' },
        { id: 3, title: 'Push day', body: 'Bench, overhead press, dips.\nGo before 9 when it is quiet.', color: 'd', when: 'Thu' },
        { id: 4, title: 'Week 7 plan with Omar & Sara', body: 'Same 4 sessions. Pick days on Sunday.', color: 'b', when: 'Wed' }
      ]
    };
  }
  renderVals() {
    const s = this.state, p = this.props;
    const v = p.variant || 'sticky';
    const COL = { a: ['Yellow', 'var(--note-a)'], b: ['Blue', 'var(--note-b)'], c: ['Pink', 'var(--note-c)'], d: ['Green', 'var(--note-d)'] };
    const n = s.notes[s.idx] || s.notes[0];
    const words = (n.body.trim() ? n.body.trim().split(/\s+/).length : 0) + (n.title.trim() ? n.title.trim().split(/\s+/).length : 0);
    const upd = (patch) => this.setState({ notes: s.notes.map((x) => (x.id === n.id ? { ...x, ...patch } : x)) });
    const step = (d) => this.setState({ idx: (s.idx + d + s.notes.length) % s.notes.length });
    return {
      themeKey: p.theme || 'bg', rootCls: 'wg' + (p.transparent ? ' is-trans' : ''),
      isSticky: v === 'sticky', isStack: v === 'stack',
      // sticky
      cur: { title: n.title, body: n.body, color: COL[n.color][1], words },
      pos: (s.idx + 1) + '/' + s.notes.length,
      prevNote: () => step(-1), nextNote: () => step(1),
      onTitle: (e) => upd({ title: e.target.value }), onBody: (e) => upd({ body: e.target.value }),
      colors: Object.keys(COL).map((k) => ({ name: COL[k][0] + ' note', v: COL[k][1], pressed: n.color === k ? 'true' : 'false', pick: () => upd({ color: k }) })),
      // stack
      noteCount: String(s.notes.length),
      draft: s.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      addNote: (e) => { e.preventDefault(); const t = s.draft.trim(); if (!t) return;
        this.setState({ draft: '', nextId: s.nextId + 1, idx: 0, notes: [{ id: s.nextId, title: t, body: '', color: 'a', when: 'Now' }].concat(s.notes) }); },
      stack: s.notes.slice(0, 4).map((x) => ({ title: x.title, preview: x.body.split('\n')[0] || 'Empty note', when: x.when, color: COL[x.color][1] }))
    };
  }
}
</script>
</body>
</html>
