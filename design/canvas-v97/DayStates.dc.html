<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facta — Day widget states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}.lab{justify-self:start;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;color:#F1F4F1;background:rgba(6,7,6,.78);padding:6px 10px;border-radius:8px}</style>
</helmet>
<div style="position: relative; min-height: 560px; overflow: hidden; background: #2B302C; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <dc-import name="Wallpaper" kind="shapes" hint-size="100%,100%"></dc-import>
  </div>
  <div style="position: relative; display: grid; grid-template-columns: repeat(4, 300px); justify-content: center; gap: 14px 24px; padding: 40px 28px">
    <span class="lab" style="grid-column: 1 / 3">NOW 13:12 · BETWEEN TWO HOURS</span>
    <span class="lab" style="grid-column: 3 / 5">NOW 13:00 · EXACTLY ON AN HOUR</span>
    <dc-import name="Widget" kind="day" now="13:12" theme="{{ theme }}" hint-size="300px,400px"></dc-import>
    <dc-import name="Widget" kind="day" now="13:12" theme="{{ theme }}" transparent="{{ true }}" hint-size="300px,400px"></dc-import>
    <dc-import name="Widget" kind="day" now="13:00" theme="{{ theme }}" hint-size="300px,400px"></dc-import>
    <dc-import name="Widget" kind="day" now="13:00" theme="{{ theme }}" transparent="{{ true }}" hint-size="300px,400px"></dc-import>
    <span class="lab" style="grid-column: 1 / 2">SOLID</span>
    <span class="lab" style="grid-column: 2 / 3">TRANSPARENT</span>
    <span class="lab" style="grid-column: 3 / 4">SOLID</span>
    <span class="lab" style="grid-column: 4 / 5">TRANSPARENT</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["bg","mid","ember","light"],"default":"bg"},"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme || 'bg' }; }
}
</script>
</body>
</html>
