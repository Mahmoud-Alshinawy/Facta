name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # A tag that doesn't match every version file, or a missing updater key,
  # builds nothing (docs/updater.md, section 7).
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check versions match the tag
        run: node scripts/check-versions.mjs "${{ github.ref_name }}" --release

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: planner
            app_dir: apps/desktop
            rust_target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_suffix: windows
          - app: planner
            app_dir: apps/desktop
            rust_target: aarch64-apple-darwin
            os: macos-latest
            artifact_suffix: macos-arm64
          - app: planner
            app_dir: apps/desktop
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_suffix: linux
          - app: widgets
            app_dir: apps/widgets
            rust_target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_suffix: windows
          - app: widgets
            app_dir: apps/widgets
            rust_target: aarch64-apple-darwin
            os: macos-latest
            artifact_suffix: macos-arm64
          - app: widgets
            app_dir: apps/widgets
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_suffix: linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.app }} (${{ matrix.artifact_suffix }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev squashfs-tools

          curl -fsSL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          projectPath: ${{ matrix.app_dir }}
          tauriScript: pnpm tauri
          # Signs the updater files with TAURI_SIGNING_PRIVATE_KEY; local
          # builds leave this off and need no key.
          args: --target ${{ matrix.rust_target }} --config ${{ github.workspace }}/.github/tauri-release.conf.json

      - name: Repair Linux AppImages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool.AppImage
        run: |
          chmod +x scripts/repair-linux-appimage.sh

          while IFS= read -r -d '' appimage; do
            scripts/repair-linux-appimage.sh "$appimage"
          done < <(
            find "${{ matrix.app_dir }}/src-tauri/target/${{ matrix.rust_target }}/release/bundle" \
              -type f \
              -name '*.AppImage' \
              -print0
          )

      # The repair changed the AppImage after Tauri signed it, so sign the
      # repaired file again. The key comes from the job's environment only.
      - name: Re-sign repaired Linux AppImages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' appimage; do
            rm -f "$appimage.sig"
            pnpm --dir "${{ matrix.app_dir }}" exec tauri signer sign "$PWD/$appimage" > /dev/null
            test -s "$appimage.sig"
          done < <(
            find "${{ matrix.app_dir }}/src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage" \
              -type f \
              -name '*.AppImage' \
              -print0
          )

      # Copy the file the updater installs and its signature under fixed
      # names, without spaces (scripts/make-update-manifests.mjs).
      - name: Stage updater files
        shell: bash
        run: |
          # macOS runners have bash 3.2: no mapfile, and -u breaks empty arrays.
          set -eo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="${{ matrix.app_dir }}/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          case "${{ matrix.app }}" in
            planner) prefix=Facta ;;
            widgets) prefix=FactaWidgets ;;
          esac
          case "${{ matrix.artifact_suffix }}" in
            windows) dir="$bundle/nsis"; suffix="-setup.exe"; name="$prefix-$version-windows-x64-setup.exe" ;;
            macos-arm64) dir="$bundle/macos"; suffix=".app.tar.gz"; name="$prefix-$version-macos-arm64.app.tar.gz" ;;
            linux) dir="$bundle/appimage"; suffix=".AppImage"; name="$prefix-$version-linux-x64.AppImage" ;;
          esac
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find "$dir" -maxdepth 1 -type f -name "*$suffix" -print0)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one updater file ending in $suffix in $dir, found ${#files[@]}"
            exit 1
          fi
          test -s "${files[0]}.sig"
          mkdir -p updater
          cp "${files[0]}" "updater/$name"
          cp "${files[0]}.sig" "updater/$name.sig"
          ls -l updater

      - name: Upload updater files
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.app }}-${{ matrix.artifact_suffix }}
          path: updater/*
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.artifact_suffix }}
          path: |
            ${{ matrix.app_dir }}/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.exe
            ${{ matrix.app_dir }}/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg
            ${{ matrix.app_dir }}/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage
            ${{ matrix.app_dir }}/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.deb
          if-no-files-found: warn

  package:
    needs: build
    runs-on: ubuntu-latest
    name: Package combined zips

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            artifact_pattern: "*-windows"
            zip_name: Facta-${{ github.ref_name }}-windows.zip
          - platform: macos
            artifact_pattern: "*-macos-arm64"
            zip_name: Facta-${{ github.ref_name }}-macos.zip
          - platform: linux
            artifact_pattern: "*-linux"
            zip_name: Facta-${{ github.ref_name }}-linux.zip

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
          pattern: ${{ matrix.artifact_pattern }}

      - name: List downloaded files
        run: find staged -type f

      - name: Create combined zip
        run: |
          cd staged
          zip -r "../${{ matrix.zip_name }}" .

      - name: Upload combined zip
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.zip_name }}

  release:
    needs: package
    runs-on: ubuntu-latest
    name: Create GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download combined zips
        uses: actions/download-artifact@v4
        with:
          path: zips
          pattern: release-*

      - name: Download updater files
        uses: actions/download-artifact@v4
        with:
          path: updater
          pattern: updater-*
          merge-multiple: true

      - name: Write update manifests
        run: |
          node scripts/make-update-manifests.mjs \
            --tag "${{ github.ref_name }}" \
            --dir updater \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          ls -l updater

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zips/**/*.zip
            updater/*
          make_latest: true
