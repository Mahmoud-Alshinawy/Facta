name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PORT: '1420'
  BASE_PATH: '/'

jobs:
  checks:
    # Same-repository branches already run on push; fork PRs still need checks.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    name: ${{ matrix.name }} checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 11 requires Node 22; set it up before installing pnpm.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Restore pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          rustc -vV | grep '^host: aarch64-apple-darwin$'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev squashfs-tools

      - name: Restore Rust caches
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/widgets/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Typecheck desktop
        run: pnpm --dir apps/desktop exec tsc --noEmit

      - name: Typecheck widgets
        run: pnpm --dir apps/widgets exec tsc --noEmit

      - name: Typecheck calendar
        run: pnpm --dir packages/calendar exec tsc --noEmit

      - name: Test desktop
        run: pnpm --dir apps/desktop exec vitest run

      - name: Test calendar
        run: pnpm --dir packages/calendar exec vitest run

      - name: Build desktop
        run: pnpm --dir apps/desktop build

      - name: Build widgets
        run: pnpm --dir apps/widgets build

      - name: Check desktop Rust
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Check widget Rust
        run: cargo check --locked --manifest-path apps/widgets/src-tauri/Cargo.toml

      - name: Test widget Rust
        run: cargo test --locked --manifest-path apps/widgets/src-tauri/Cargo.toml
